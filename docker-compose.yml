x-env: &env
  env_file:
    - ./user-service/.env.prod

x-user-service: &user-service
  <<: *env
  build:
    context: ./user-service
    dockerfile: Dockerfile
  image: user-service:latest
  restart: unless-stopped

x-user-depends: &user-depends
  postgres-user:
    condition: service_healthy
  redis:
    condition: service_healthy
  rabbitmq:
    condition: service_healthy

services:
  postgres-user:
    <<: *env
    container_name: postgres-user
    image: postgres:15
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432" # untuk GUI di host
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  rabbitmq:
    <<: *env
    image: rabbitmq:3.13-management
    restart: unless-stopped
    ports:
      - "127.0.0.1:15672:15672" # management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: elasticsearch:7.17.10
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --silent --fail localhost:9200/_cluster/health | grep -q '\"status\":\"yellow\"\\|\"status\":\"green\"'",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  user-service:
    <<: *user-service
    ports:
      - "8080:8080"
    depends_on: *user-depends

  user-grpc:
    <<: *user-service
    command: ["start-grpc"]
    expose:
      - "50051"
    depends_on: *user-depends

  user-worker-update-location:
    <<: *user-service
    command: ["worker-update-location"]
    depends_on: *user-depends

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  es_data:
